[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "takeout-garmin-sync"
version = "0.1.0"
description = "Sync Google Takeout weight data to Garmin Connect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "garmin",
    "garmin connect",
    "google fit",
    "google takeout",
    "weight",
    "fit file",
    "health sync",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
takeout-garmin-sync = "takeout_garmin_sync.cli:main"

[project.urls]
Repository = "https://github.com/james-b-fitzgerald/takeout-garmin-sync"
Issues = "https://github.com/james-b-fitzgerald/takeout-garmin-sync/issues"

[tool.setuptools.packages.find]
include = ["takeout_garmin_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
